name: 네이버 부동산 크롤링

on:
  schedule:
    # 매일 새벽 4시 (한국시간, UTC+9 = 전날 19:00 UTC)
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Python 의존성 설치
        run: |
          pip install -r requirements.txt

      - name: Playwright 브라우저 설치
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 서비스 계정 키 생성
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::Missing secret SERVICE_ACCOUNT_JSON"; exit 1;
          fi
          printf "%s" "$SERVICE_ACCOUNT_JSON" > service_account.json
          ls -lh service_account.json

      - name: 크롤링 실행
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Seoul
        run: |
          set -o pipefail
          python main_github.py 2>&1 | tee run.log

      - name: 결과 및 로그 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ github.run_number }}
          path: |
            crawling_results.json
            run.log
          if-no-files-found: warn
          retention-days: 30

      - name: 정리
        if: always()
        run: rm -f service_account.json
